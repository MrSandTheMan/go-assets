<title>Courtney Mendez | 5 Film-Ready Video Scripts</title>
<style>
#ga-playbook-app{--ink:#0a1628;--panel:#10203a;--panel2:#16294a;--cream:#ffffff;--muted:#b8c5d6;--gold:#7fa8d9;--line:#2a3f5f;color:var(--cream);background:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6;min-height:100vh;isolation:isolate}
#ga-playbook-app *{box-sizing:border-box}
#ga-playbook-app h1,#ga-playbook-app h2,#ga-playbook-app h3,#ga-playbook-app .serif{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.025em}
#ga-playbook-app h1,#ga-playbook-app h2,#ga-playbook-app h3,#ga-playbook-app p{margin-top:0}
.ga-shell{max-width:1180px;margin:auto;padding:28px 22px 88px}
.ga-topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 18px;margin-bottom:34px}
.ga-brand{font-size:12px;text-transform:uppercase;letter-spacing:.22em;color:var(--gold);font-weight:700}
.ga-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:12px}
.ga-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:0;background:var(--panel);border:1px solid var(--line);overflow:hidden;margin-bottom:34px}
.ga-hero-copy{padding:clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:center}
.ga-hero h1{font-size:clamp(42px,6.8vw,84px);line-height:.94;margin-bottom:24px;max-width:760px}
.ga-hero p{max-width:620px;color:var(--muted);font-size:17px}
.ga-hero-mono{min-height:520px;overflow:hidden;background:linear-gradient(135deg,#10203a 0%,#0a1628 100%)}
.ga-hero-mono img{width:100%;height:100%;object-fit:cover;display:block}
.ga-section{background:var(--panel);border:1px solid var(--line);padding:clamp(24px,4vw,52px);margin-top:26px}
.ga-section-title{font-size:clamp(30px,4vw,54px);line-height:1.05;margin-bottom:10px}
.ga-lede{color:var(--muted);max-width:720px;margin-bottom:34px}
.ga-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:32px;flex-wrap:wrap}
.ga-btn{appearance:none;border:1px solid var(--gold);background:var(--gold);color:#161713;padding:14px 22px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px;cursor:pointer;min-height:48px;text-decoration:none;display:inline-block;text-align:center}
.ga-btn:hover{filter:brightness(1.08)}
.ga-btn-secondary{background:transparent;color:var(--cream);border-color:#716d60}
.ga-only-action{justify-content:center}.ga-only-action .ga-btn{min-width:min(100%,340px);font-size:13px;padding:17px 24px}
.ga-ready{display:flex;justify-content:space-between;gap:28px;align-items:end;margin:46px 0 28px}.ga-ready h2{font-size:clamp(40px,6vw,72px);line-height:.98;margin:0}.ga-ready p{color:var(--muted);margin:0;max-width:430px}
.ga-card{background:var(--panel);border:1px solid var(--line);margin:22px 0;overflow:hidden}.ga-card-head{display:grid;grid-template-columns:110px 1fr;border-bottom:1px solid var(--line)}
.ga-num{display:grid;place-items:center;background:var(--gold);color:#171813;font:58px/1 Georgia,serif;min-height:150px}.ga-card-title{padding:28px}.ga-card-title h3{font-size:clamp(27px,3vw,42px);line-height:1.04;margin:0 0 10px}.ga-card-title p{color:var(--muted);margin:0}
.ga-card-body{display:grid;grid-template-columns:1.25fr .75fr;gap:0}.ga-script{padding:clamp(24px,4vw,44px);border-right:1px solid var(--line)}.ga-production{padding:clamp(24px,3vw,34px);background:var(--panel2)}
.ga-block{margin-bottom:28px}.ga-block:last-child{margin-bottom:0}.ga-block h4{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold);margin:0 0 10px}.ga-hook{font:clamp(22px,2.8vw,34px)/1.2 Georgia,serif;color:#fff;border-left:3px solid var(--gold);padding-left:18px}.ga-script-text{white-space:pre-line;color:#eee9df}.ga-note{color:var(--muted)}
.ga-check{display:grid;grid-template-columns:24px 1fr;gap:11px;align-items:start;margin:14px 0;cursor:pointer}.ga-check input{position:absolute;opacity:0;pointer-events:none}.ga-box{width:21px;height:21px;border:1px solid #8d887a;display:grid;place-items:center;margin-top:2px}.ga-check input:checked+.ga-box{background:var(--gold);border-color:var(--gold)}.ga-check input:checked+.ga-box:after{content:'✓';color:#171813;font-weight:900;line-height:1}.ga-check input:focus-visible+.ga-box{outline:2px solid #fff;outline-offset:2px}.ga-check input:checked~span:last-child{text-decoration:line-through;color:#9e988c}
.ga-copy{margin-top:22px;width:100%}.ga-copy[data-copied='1']{background:#e8d09a}
.ga-notes{list-style:none;margin:0;padding:0}
.ga-notes li{position:relative;padding:14px 0 14px 38px;color:#eee9df;border-top:1px solid var(--line);font-size:16px}
.ga-notes li:before{content:'✓';position:absolute;left:6px;top:14px;color:var(--gold);font-weight:900}
.ga-schedule{background:var(--cream);color:#191a17;padding:clamp(26px,5vw,56px);margin-top:28px}.ga-schedule h2{font-size:clamp(34px,5vw,58px);line-height:1;margin-bottom:10px}.ga-schedule p{color:#555145}
.ga-footer{text-align:center;color:#898477;font-size:12px;padding:34px 0 0}
@media(max-width:800px){.ga-hero{grid-template-columns:1fr}.ga-hero-mono{min-height:390px;order:-1}.ga-card-body{grid-template-columns:1fr}.ga-script{border-right:0;border-bottom:1px solid var(--line)}.ga-ready{display:block}.ga-ready p{margin-top:16px}}
@media(max-width:520px){.ga-shell{padding:16px 12px 60px}.ga-hero-copy{padding:30px 22px}.ga-hero-mono{min-height:330px}.ga-section{padding:24px 18px}.ga-card-head{grid-template-columns:72px 1fr}.ga-num{font-size:40px;min-height:130px}.ga-card-title{padding:22px 18px}.ga-actions .ga-btn{width:100%}}
</style>

const cards=[
{title:'The 20% Down Payment Myth',
desc:'First-time buyers are waiting too long. This script reframes the math so they act sooner, with you as the guide.',
tip:'Keep the tone direct, like advice to a friend. The Park Slope example is your proof. Say the address and the price with confidence.',
hook:`If you're still saving 20% for your Brooklyn down payment, stop. You're costing yourself a home.`,
body:`I've closed 19 sales across Brooklyn, and almost none of my first-time buyers put 20% down. Here's the math nobody shows you. Take a real Park Slope two-bedroom I sold at 315 Gates Avenue for $1,195,000. At 10% down instead of 20, your monthly payment goes up by a few hundred dollars, but you buy two to three years sooner. In a market where that same apartment appreciates while you save, waiting is the expensive move. What actually matters: your monthly payment comfort, and keeping cash in reserve after closing. Co-op boards care about reserves, not your down payment percentage.`,
close:`Thinking about buying in Brooklyn next year? Save this one. Part 2: what co-op boards actually check before they approve you.`},
{title:'The $2.625M Penthouse the Photos Missed',
desc:'A sold story that proves your edge. You sell the feeling, not the square footage.',
tip:'Slow down on the golden hour line. That is the moment. Let the feeling land before the lesson.',
hook:`This penthouse sold for $2.625 million. The listing photos missed the best part.`,
body:`84 Congress Street, penthouse, three bed, three bath, 1,710 square feet. Beautiful listing, shot perfectly. But here's what sold it: the private outdoor space at golden hour. Photos showed the terrace. They didn't show what it feels like to stand up there at 6 PM with the whole skyline open in front of you. Every serious buyer who walked in felt it in the first thirty seconds, and the offers followed. Lesson I tell every seller: buyers don't buy square footage. They buy the moment they picture their life in the space. Find that moment in your listing, and lead with it.`,
close:`I'm Courtney Mendez, Brooklyn brownstone specialist with Serhant. Follow for what actually moves Brooklyn listings.`},
{title:'Brownstone vs Co-op vs Condo',
desc:'The question every Brooklyn buyer asks. Answer it once, on camera, and let it work for you.',
tip:'Count the three types on your fingers as you name them. It makes the breakdown easy to follow.',
hook:`Buying in Brooklyn? Pick the building type before you pick the neighborhood. It matters more.`,
body:`Quick breakdown from someone who's sold all three. Brownstones: unmatched charm, Park Slope, Prospect Heights, Clinton Hill, but budget for maintenance surprises, old systems hide behind pretty moldings. Co-ops: often the best value per square foot, I've sold several around $1.2 to $1.3 million, but the board application is real, they want strong reserves and clean finances. Condos: easiest purchase, fewest rules, and you pay for it. So: want character and you're handy or patient? Brownstone. Want value and your paperwork is clean? Co-op. Want simple? Condo.`,
close:`Not sure which one fits you? DM me your budget and your timeline, and I'll tell you straight.`},
{title:'The Open House Morning',
desc:'A personal story that shows how you work. Calm, patient, observant. That is the brand.',
tip:'This one is personal. Softer energy, real eye contact. Let the reviews line land naturally.',
hook:`I start every Brooklyn open house the same way, and it's not what you'd expect.`,
body:`Before the first buyer walks in, I do twenty minutes of yoga. Sounds unrelated to real estate, but it's the whole job. A calm agent reads the room. I notice which couple keeps going back to the kitchen, who's actually picturing their furniture, who needs space and who needs answers. My clients tell me the same thing in reviews: patient, available, never rushed. That's not an accident, it's the morning routine. House hunting is already stressful. Your agent shouldn't add to it.`,
close:`House hunting shouldn't feel like a race. Link in bio if you want a calmer search.`},
{title:'Should You Buy in Brooklyn Right Now?',
desc:'The honest framework that builds trust. No pitch, just numbers, and an open door to DM you.',
tip:'Stay neutral and honest. The trust you build here is what gets the DM.',
hook:`Should you buy in Brooklyn right now? Honest answer from someone who's sold $27 million here.`,
body:`Nineteen closings, about $1.4 million average. Here's my honest framework, no sales pitch. Don't try to time rates, try to time your life. If you're renting a one-bedroom in Park Slope for $3,800 and you plan to stay five-plus years, buying usually wins, even at today's rates, because you're building equity instead of paying someone else's mortgage. Who should wait: anyone buying because they're scared prices will run away. Fear is a terrible advisor and a worse down payment. Who shouldn't wait: anyone with stable income, real reserves, and a five-year horizon. The best time to buy is when your life is ready, not when the headlines say so.`,
close:`Want the math on your situation? DM me. No pitch, just numbers.`}
];
const notes=[
'Vertical 1080x1920, phone on a tripod or propped at eye level, window light on your face.',
'Say the hook in the first 3 seconds, then the hook as a title card over your face.',
'Burned-in captions, white bold type, soft shadow, no boxes.',
'End on your closing line, hold eye contact one beat, then cut.'
];
function cardHtml(c,i){

<script>
(function(){
  var KEY='courtney-playbook-checks-v1';
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  var state = load();
  // Tag each checkbox with a unique key based on its card and position
  var cards = document.querySelectorAll('.ga-card');
  cards.forEach(function(card, ci){
    var boxes = card.querySelectorAll('.ga-check input[type="checkbox"]');
    boxes.forEach(function(box, bi){
      var key = 'script'+(ci+1)+'-check'+(bi+1);
      if(state[key]){ box.checked = true; }
      box.addEventListener('change', function(){
        var s = load();
        s[key] = box.checked;
        save(s);
      });
    });
  });
})();
</script>
</body>
