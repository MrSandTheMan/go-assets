<script>
/* Fire Meta Lead event when either landing-page form succeeds.
   The /help page shows #valOk / #contactOk (display:block) on success. */
(function(){
  function fireLead(){ try{ if(window.fbq) fbq('track','Lead'); }catch(e){} }
  var fired={};
  function watch(id){
    var el=document.getElementById(id);
    if(!el) return;
    if(el.style.display!=='none' && el.offsetParent!==null && !fired[id]){ fired[id]=true; fireLead(); return; }
    var obs=new MutationObserver(function(){
      if(!fired[id] && el.style.display!=='none'){ fired[id]=true; fireLead(); obs.disconnect(); }
    });
    obs.observe(el,{attributes:true,attributeFilter:['style']});
  }
  function init(){ watch('valOk'); watch('contactOk'); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
