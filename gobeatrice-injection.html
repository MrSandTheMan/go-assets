<!-- GoBeatrice header injection, pulled verbatim from the live Squarespace page
     (GoBeatrice > Page Settings > Advanced) on 2026-09-28. Read-only copy.
     Reusable skeleton for future Go client pages. -->
<style>
/* --- GoBeatrice page patches --- */
.hero h1{font-size:clamp(24px,4.2vw,40px); }
.page-text p{line-height:1.75; }
.btn{display:inline-block;margin-top:14px;padding:13px 26px;border-radius:999px;
background:#e8323c;color:#fff!important;text-decoration:none;font-weight:700; }
.btn.go-master-btn{background:#FFD60A!important;color:#111!important; }
.btn.approve{
background:transparent;
border:1.5px solid #4ade80;
color:#4ade80;
}
.btn.approve:hover{background:rgba(74,222,128,0.10);text-decoration:none; }
.btn.approve.armed{
background:#4ade80;
border-color:#4ade80;
color:#0b0b0c;
}
.btn.approve.done{
border-color:#232327;
cursor:default;
}
.homescreen-prompt{
max-width:680px;
margin:0 auto;
padding:36px 24px 72px;
text-align:center;
}
.hs-title{
font-family:Georgia,"Times New Roman",serif;
font-style:italic;
font-size:17px;
color:#f5f5f5;
margin:0 0 18px;
}
.hs-btns{
display:flex;
gap:12px;
justify-content:center;
margin-bottom:22px;
}
.hs-btns .btn.hs-opt{
margin-top:0;
flex:0 1 200px;
background:transparent;
border:1.5px solid #3a3a3f;
color:#c9c9cd;
}
.hs-btns .btn.hs-opt:hover{
border-color:#e8323c;
color:#ffffff;
text-decoration:none;
}
.hs-btns .btn.hs-opt.active{
background:rgba(232,50,60,0.12);
}
.hs-guide img{
display:block;
width:100%;
max-width:440px;
margin:0 auto;
border-radius:14px;
border:1px solid #232327;
box-shadow:0 12px 40px rgba(0,0,0,0.45);
}
.review-modal{
position:fixed;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.65);
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
padding:16px;
}
.review-card{
background:#121214;
border-radius:16px;
padding:24px;
width:min(680px,100%);
max-height:88vh;
overflow-y:auto;
position:relative;
color:#f5f5f5;
}
.review-close{
position:absolute;
top:6px;
right:12px;
background:none;
border:0;
color:#8a8a8e;
font-size:30px;
line-height:1;
cursor:pointer;
padding:4px 8px;
}
.review-close:hover{color:#ffffff; }
.review-title{
text-align:center;
font-size:20px;
margin:0 0 20px;
color:#f5f5f5;
}
.rv{margin-bottom:28px; }
.rv:last-child{margin-bottom:0; }
.rv-title{
font-weight:700;
font-size:16px;
margin:0 0 12px;
}
.rv-title span{font-weight:400;color:#8a8a8e; }
.rv-player{display:flex;justify-content:center;background:#000;border-radius:12px;position:relative;
overflow:hidden;cursor:pointer; }
.rv-player iframe{height:min(60vh,177.78vw);aspect-ratio:9/16;width:auto;max-width:100%;border:0;border-radius:12px; }
.rv-player video{height:min(60vh,177.78vw);aspect-ratio:9/16;width:auto;max-width:100%;border-radius:12px;background:#000; }
.rv-fs-block{position:absolute;top:0;left:0;right:0;height:64px;z-index:5; }
.rv-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;border:0;background:rgba(0,0,0,0.55);color:#fff;font-size:26px;cursor:pointer; }
.rv-progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25);cursor:pointer; }
.rv-progress-fill{height:100%;width:0%;background:#fff; }
.btn.rv-approve{margin-top:12px; }
.guide-toggle{background:transparent;border:1px solid #3a3a3f;color:#c9c9cd;border-radius:999px;padding:10px 22px;font:inherit;font-size:14px;font-weight:600;cursor:pointer; }
.guide-toggle:hover{border-color:#e8323c;color:#ffffff; }
.guide-toggle.open{border-color:#e8323c;color:#ffffff;background:rgba(232,50,60,0.12); }
.audio-guide-wrap{margin-top:16px;text-align:center; }
.audio-guide-panel{margin-top:12px; }
.audio-guide-panel img{display:block;width:100%;max-width:520px;margin:0 auto;border-radius:12px; }
.rv-guide-wrap{margin-top:12px; }
.rv-guide-panel{margin-top:12px; }
.rv-guide-panel img{display:block;width:100%;border-radius:12px; }
.rv-upload-block{margin-top:16px;background:#0b0b0c;border:1px solid #232327;border-radius:12px;padding:18px; }
.rv-upload-title{font-size:16px;font-weight:700;margin:0 0 12px;color:#f5f5f5;text-align:center; }
.rv-upload-done{display:none;text-align:center;font-size:14px;color:#4ade80;margin:0 0 12px; }
.rv-file-row{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px; }
.rv-file-label{display:inline-block;padding:10px 20px;border-radius:999px;border:1.5px solid #3a3a3f;color:#c9c9cd;font-size:14px;font-weight:600;cursor:pointer; }
.rv-file-label:hover{border-color:#e8323c;color:#ffffff; }
.rv-file-name{font-size:13px;color:#8a8a8e;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.rv-send-btn{display:block;width:100%;margin-top:4px;padding:13px 26px;border-radius:999px;border:0;background:#E00020;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer; }
.rv-send-btn:disabled{background:#3a3a3f;color:#8a8a8e;cursor:not-allowed; }
.rv-send-btn:not(:disabled):hover{background:#ff1a33; }
.rv-upload-status{text-align:center;font-size:13px;margin:10px 0 0;color:#8a8a8e;min-height:18px; }
.rv-upload-status.ok{color:#4ade80; }
.rv-upload-status.err{color:#ff6b6b; }
.rv-form-alt{text-align:center;font-size:13px;margin:12px 0 0;color:#8a8a8e; }
.rv-form-alt a{color:#f5f5f5; }
.rv-notes textarea{
width:100%;
padding:10px 12px;
border-radius:10px;
font:inherit;
font-size:14px;
background:#0b0b0c;
border:1px solid #232327;
color:#f5f5f5;
resize:vertical;
box-sizing:border-box;
}
.btn.rv-notes-btn{
margin-top:8px;
background:transparent;
border:1.5px solid #3a3a3f;
color:#c9c9cd;
}
.btn.rv-notes-btn:hover{
border-color:#e8323c;
color:#ffffff;
text-decoration:none;
}
.rv-msg{
font-size:13px;
text-align:center;
margin:10px 0 0;
color:#8a8a8e;
}
.review-drive{
text-align:center;
margin:16px 0 0;
font-size:14px;
color:#8a8a8e;
}
.review-drive a{color:#f5f5f5; }
.go-testbanner{background:#E00020;color:#fff;font-weight:700;text-align:center;padding:10px 16px;font-size:14px; }
.lp-review{background:#121214;border:1px solid #232327;border-radius:12px;padding:22px 20px; }
.lp-review .lp-sub{color:#c9c9cd;font-size:15px;margin:0 0 6px;line-height:1.6; }
.lp-review .btn{margin:10px 10px 0 0; }
.lp-review .rv-notes{margin-top:14px; }
.ab-input{
width:100%;
padding:13px 14px;
border-radius:10px;
font:inherit;
font-size:15px;
background:#0b0b0c;
border:1px solid #232327;
color:#f5f5f5;
box-sizing:border-box;
margin:10px 0 0;
}
.ab-input:focus{outline:none;border-color:#e8323c; }
.ab-input::placeholder{color:#6a6a6e; }
.btn.ab-send{background:#E00020;color:#fff;border:0;font-weight:700; }
.btn.ab-send:hover{background:#ff1a33;text-decoration:none; }
</style>
<script>
document.addEventListener('DOMContentLoaded',function() {
var GIST_URL='https://gist.githubusercontent.com/MrSandTheMan/45bda61d8b76598ff5da58e562463889/raw/gobeatrice-tracker.json';
fetch(GIST_URL+'?t='+Date.now()).then(function(r){return r.json(); }).then(function(data) {
var card=data&&data.card;
if(!card)return;
var GUIDE_IMG_FALLBACK='https://raw.githubusercontent.com/MrSandTheMan/go-assets/main/gobeatrice/audio-guide.png';
var guideImgUrl=(card.audio_upload&&card.audio_upload.guide_img)||GUIDE_IMG_FALLBACK;
var paras=document.querySelectorAll('.priority p');
for(var i=0;i<paras.length;i++) {
if(paras[i].textContent.indexOf('Five video edits')!==-1) {
paras[i].innerHTML='<b>'+card.priority_heading+'</b> '+card.priority;
var n=paras[i].nextElementSibling;
var btn=(n&&n.classList&&n.classList.contains('btn'))?n:document.createElement('a');
btn.className='btn';
btn.href=card.button_url;
btn.target='_blank';
btn.textContent=card.button_label;
if(!btn.parentNode)paras[i].insertAdjacentElement('afterend',btn);
if(card.audio_upload&&card.audio_upload.enabled&&!document.querySelector('.audio-guide-wrap')) {
var agWrap=document.createElement('div');
agWrap.className='audio-guide-wrap';
agWrap.innerHTML='<button class="guide-toggle audio-guide-toggle" type="button">How to record your audio</button>'+'<div class="audio-guide-panel" style="display:none"><img data-src="'+guideImgUrl+'" alt="How to record your audio"></div>';
btn.insertAdjacentElement('afterend',agWrap);
var agToggle=agWrap.querySelector('.audio-guide-toggle');
var agPanel=agWrap.querySelector('.audio-guide-panel');
var agImg=agWrap.querySelector('img');
agToggle.addEventListener('click',function() {
var show=agPanel.style.display==='none';
agPanel.style.display=show?'block':'none';
agToggle.classList.toggle('open',show);
if(show&&!agImg.getAttribute('src')){agImg.setAttribute('src',agImg.getAttribute('data-src')); }
});
}
break;
}
}
var BACKEND={url:'https://script.google.com/macros/s/AKfycbzrvhRFd9K-zLO_BtmUBAgdWoYlvoKUlcuIF-dInAQ8wwxMLkK4hqiJXCtofsi1wHht/exec',token:'0e5da46e84e4f69a55f413afaed8d348'};
var CLIENT_NAME='Beatrice Caponnetti Jackson';
var TEST_MODE=/(?:\?|&)test=1(?:&|$)/.test(window.location.search);
if(/(?:\?|&)clear=1(?:&|$)/.test(window.location.search)) {
try{localStorage.removeItem('gobeatrice_approval_landing'); }catch(e) {}
}
/* Go default: every approval and note sends a formatted email to team@ via the
   backend web app. ?test=1 tags the subject [TEST] so tests never mix with
   real client submissions. */
function goPost(payload){
var p={token:BACKEND.token,action:payload.action,subject:payload.subject,item:payload.item,body:payload.body,from:CLIENT_NAME};
if(TEST_MODE){
p.subject='[TEST] '+(p.subject||p.action||'');
p.body='TEST SUBMISSION - sent from a ?test=1 page load, not by the client.\n\n'+(p.body||'');
}
return fetch(BACKEND.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)}).then(function(r){return r.json();});
}
if(TEST_MODE) {
var tb=document.createElement('div');
tb.className='go-testbanner';
tb.textContent='TEST MODE — approvals and notes from this visit are tagged [TEST] and do not count.';
document.body.insertBefore(tb,document.body.firstChild);
}
/* --- Landing page review section (gated by card.landing_review) --- */
var lp=card.landing_review;
if(lp&&lp.enabled) {
var lpUrl=lp.url||'https://www.bcjteam.com/help';
var lpLabel=lp.label||'Ad landing page';
var lpSec=document.createElement('section');
lpSec.className='lp-section';
var lpApprovedDate=null;
if(lp.status==='approved') {lpApprovedDate=lp.approved_date||''; }
else {
try{var lps=JSON.parse(localStorage.getItem('gobeatrice_approval_landing')||'null'); if(lps&&lps.date)lpApprovedDate=lps.date; }catch(e) {}
}
var lpInner='<h2>'+lpLabel+'</h2><div class="lp-review">';
if(!lpApprovedDate) {
lpInner+='<p class="lp-sub">This is the page your ads will send people to. Look it over, then approve it or send notes below.</p>';
lpInner+='<a class="btn" href="'+lpUrl+'" target="_blank" rel="noopener">View landing page</a>';
lpInner+='<a class="btn approve lp-approve" href="#">Approve landing page</a>';
lpInner+='<div class="rv-notes"><textarea rows="2" placeholder="Want changes to the landing page? Write them here..."></textarea><a class="btn rv-notes-btn lp-notes-btn" href="#">Send notes</a></div><p class="rv-msg lp-msg" style="display:none"></p>';
}else{
lpInner+='<p class="lp-sub">Approved '+lpApprovedDate+' — thank you!</p>';
lpInner+='<a class="btn" href="'+lpUrl+'" target="_blank" rel="noopener">View landing page</a>';
}
lpInner+='</div>';
lpSec.innerHTML=lpInner;
var priPara=document.querySelector('.priority p');
var priSec=(priPara&&priPara.closest)?priPara.closest('section'):null;
if(priSec&&priSec.parentNode) {priSec.insertAdjacentElement('afterend',lpSec); }
else {document.body.appendChild(lpSec); }
if(!lpApprovedDate) {
var lpApproveBtn=lpSec.querySelector('.lp-approve');
var lpNotesArea=lpSec.querySelector('.rv-notes textarea');
var lpNotesBtn=lpSec.querySelector('.lp-notes-btn');
var lpMsg=lpSec.querySelector('.lp-msg');
var lpArmed=false,lpArmTimer=null;
lpApproveBtn.addEventListener('click',function(e) {
e.preventDefault();
if(lpApproveBtn.classList.contains('done'))return;
if(!lpArmed) {
lpArmed=true;
lpApproveBtn.textContent='Tap again to confirm';
lpApproveBtn.classList.add('armed');
lpArmTimer=setTimeout(function() {
lpArmed=false;
lpApproveBtn.classList.remove('armed');
lpApproveBtn.textContent='Approve landing page';
},12000);
}else{
clearTimeout(lpArmTimer);
lpArmed=false;
lpApproveBtn.textContent='Sending...';
goPost({action:'Approval',subject:'Beatrice approved the '+lpLabel.toLowerCase(),item:lpLabel,body:'I approve the '+lpLabel.toLowerCase()+' as final.'}).then(function() {
var d=new Date();
var ld=(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();
try{localStorage.setItem('gobeatrice_approval_landing',JSON.stringify({date:ld})); }catch(e) {}
lpApproveBtn.textContent='Approved '+ld+' — thank you!';
lpApproveBtn.classList.remove('armed');
lpApproveBtn.classList.add('done');
}).catch(function() {
lpApproveBtn.textContent='Something went wrong — tap to retry';
lpArmed=false;
});
}
});
lpNotesBtn.addEventListener('click',function(e) {
e.preventDefault();
var noteText=lpNotesArea.value.trim();
if(!noteText) {
lpMsg.textContent='Write your notes first.';
lpMsg.style.display='block';
return;
}
lpNotesBtn.textContent='Sending...';
goPost({action:'Revision notes',subject:'Beatrice sent notes on the '+lpLabel.toLowerCase(),item:lpLabel,body:noteText}).then(function() {
lpMsg.textContent='Notes sent — thank you!';
lpMsg.style.display='block';
lpNotesArea.value='';
lpNotesBtn.textContent='Send notes';
}).catch(function() {
lpMsg.textContent='Something went wrong — try again.';
lpMsg.style.display='block';
lpNotesBtn.textContent='Send notes';
});
});
}
}
/* --- Ad budget section (gated by card.ad_budget) --- */
var ab=card.ad_budget;
if(ab&&ab.enabled) {
var abSec=document.createElement('section');
abSec.className='lp-section ab-section';
var abReceived=null;
if(ab.status==='received') {abReceived=ab.received_date||''; }
else {
try{var abs=JSON.parse(localStorage.getItem('gobeatrice_budget')||'null'); if(abs&&abs.date)abReceived=abs.date; }catch(e) {}
}
var abInner='<h2>'+(ab.label||'Ad budget')+'</h2><div class="lp-review">';
if(!abReceived) {
abInner+='<p class="lp-sub">'+(ab.sub||'What monthly ad budget should we plan around?')+'</p>';
abInner+='<input class="ab-input" type="text" inputmode="decimal" placeholder="e.g. 2000 / month" aria-label="Monthly ad budget">';
abInner+='<a class="btn ab-send" href="#">Send budget</a><p class="rv-msg ab-msg" style="display:none"></p>';
}else{
abInner+='<p class="lp-sub">Budget received '+abReceived+', thank you!</p>';
}
abInner+='</div>';
abSec.innerHTML=abInner;
var lpSecEl=document.querySelector('.lp-section:not(.ab-section)');
if(lpSecEl&&lpSecEl.parentNode) {lpSecEl.insertAdjacentElement('afterend',abSec); }
else {
var abPriPara=document.querySelector('.priority p');
var abPriSec=(abPriPara&&abPriPara.closest)?abPriPara.closest('section'):null;
if(abPriSec&&abPriSec.parentNode) {abPriSec.insertAdjacentElement('afterend',abSec); }
else {document.body.appendChild(abSec); }
}
if(!abReceived) {
var abInput=abSec.querySelector('.ab-input');
var abSend=abSec.querySelector('.ab-send');
var abMsg=abSec.querySelector('.ab-msg');
var abSending=false;
abSend.addEventListener('click',function(e) {
e.preventDefault();
if(abSending)return;
var abVal=abInput.value.trim();
if(!abVal) {
abMsg.textContent='Type your budget first.';
abMsg.style.display='block';
return;
}
abSending=true;
abSend.textContent='Sending...';
goPost({action:'Budget',subject:'Beatrice shared her ad budget',item:'Ad budget',body:'Monthly ad budget: '+abVal}).then(function() {
var d=new Date();
var ld=(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();
try{localStorage.setItem('gobeatrice_budget',JSON.stringify({date:ld,value:abVal})); }catch(e) {}
abMsg.textContent='Budget received '+ld+', thank you!';
abMsg.style.display='block';
abInput.style.display='none';
abSend.style.display='none';
}).catch(function() {
abSending=false;
abMsg.textContent='Something went wrong, tap to retry';
abMsg.style.display='block';
abSend.textContent='Send budget';
});
});
}
}
var pending=(card.review_videos||[]).filter(function(v) {return v.status!=='approved'; });
if(pending.length>0) {
var modal=document.createElement('div');
modal.className='review-modal';
modal.id='reviewModal';
modal.style.display='none';
var listHtml='';
for(var qi=0;qi<pending.length;qi++) {
var qv=pending[qi];
var qlabel=qv.label||('Edit '+qv.n);
var qlower=qlabel.toLowerCase();
var playerHtml;
if(qv.src) {
playerHtml='<div class="rv-player"><video playsinline preload="none" data-src="'+qv.src+'"></video>'+'<button class="rv-play" aria-label="Play video">&#9654;</button>'+'<div class="rv-progress"><div class="rv-progress-fill"></div></div></div>';
}else{
playerHtml='<div class="rv-player"><iframe data-src="https://drive.google.com/file/d/'+qv.drive_id+'/preview" title="'+qlabel+' preview"></iframe><div class="rv-fs-block" aria-hidden="true"></div></div>';
}
var actionHtml;
if(qv.status==='needs_audio'&&card.audio_upload&&card.audio_upload.enabled) {
var formViewUrl=card.audio_upload.form_url;
actionHtml='<div class="rv-guide-wrap">'+'<button class="guide-toggle rv-guide-toggle" type="button">How to record your audio</button>'+'<div class="rv-guide-panel" style="display:none"><img data-guide-src="'+guideImgUrl+'" alt="How to record your audio"></div>'+'</div>'+'<div class="rv-upload-block">'+'<p class="rv-upload-title">Upload your audio</p>'+'<p class="rv-upload-done" style="display:none"></p>'+'<div class="rv-file-row">'+'<label class="rv-file-label" for="rv-file-'+qv.n+'">Choose audio file</label>'+'<input type="file" id="rv-file-'+qv.n+'" accept="audio/*" style="display:none">'+'<span class="rv-file-name">No file chosen</span>'+'</div>'+'<button class="rv-send-btn" type="button" disabled>Send audio</button>'+'<p class="rv-upload-status"></p>'+'<p class="rv-form-alt"><a href="'+formViewUrl+'" target="_blank" rel="noopener">Having trouble? Open the upload form in a new tab</a></p>'+'</div>';
}else{
actionHtml='<a class="btn rv-approve approve" href="#">Approve '+qlower+'</a>';
}
listHtml+='<div class="rv" data-n="'+qv.n+'">'+'<p class="rv-title">'+qlabel+' <span>'+(qv.title||'')+'</span></p>'+playerHtml+actionHtml+'<div class="rv-notes"><textarea rows="2" placeholder="Want changes to '+qlower+'? Write them here..."></textarea>'+'<a class="btn rv-notes-btn" href="#">Send notes</a></div>'+'<p class="rv-msg" style="display:none"></p></div>';
}
modal.innerHTML='<div class="review-card"><button class="review-close" aria-label="Close">×</button>'+'<h3 class="review-title">Review your edits</h3><div class="review-list">'+listHtml+'</div>'+'<p class="review-drive">Prefer Drive? <a href="'+card.button_url+'" target="_blank" rel="noopener">'+'Open edits 1 & 2 in Google Drive</a></p></div>';
document.body.appendChild(modal);
var rvEls=modal.querySelectorAll('.rv');
for(var wi=0;wi<rvEls.length;wi++) {
(function(rvEl,v) {
var label=v.label||('Edit '+v.n);
var labelLower=label.toLowerCase();
var nativeVideo=rvEl.querySelector('.rv-player video');
var playerFrame=rvEl.querySelector('.rv-player iframe');
var playerEl=nativeVideo||playerFrame;
if(v.aspect&&playerEl) {playerEl.style.aspectRatio=v.aspect.replace(':','/'); }
if(nativeVideo) {
var playBtn=rvEl.querySelector('.rv-play');
var progBar=rvEl.querySelector('.rv-progress');
var progFill=rvEl.querySelector('.rv-progress-fill');
var togglePlay=function() {
if(nativeVideo.paused) {
var pr=nativeVideo.play();
if(pr&&pr.catch) {pr.catch(function(){}); }
}else{
nativeVideo.pause();
}
};
nativeVideo.addEventListener('click',togglePlay);
playBtn.addEventListener('click',togglePlay);
nativeVideo.addEventListener('play',function() {playBtn.style.display='none'; });
nativeVideo.addEventListener('pause',function() {playBtn.style.display=''; });
nativeVideo.addEventListener('timeupdate',function() {
if(nativeVideo.duration) {progFill.style.width=(nativeVideo.currentTime/nativeVideo.duration*100)+'%'; }
});
progBar.addEventListener('click',function(e) {
var r=progBar.getBoundingClientRect();
var ratio=(e.clientX-r.left)/r.width;
if(ratio<0) {ratio=0; }
if(ratio>1) {ratio=1; }
if(nativeVideo.duration) {nativeVideo.currentTime=ratio*nativeVideo.duration; }
});
}
var rvGuideToggle=rvEl.querySelector('.rv-guide-toggle');
if(rvGuideToggle) {
var rvGuidePanel=rvEl.querySelector('.rv-guide-panel');
var rvGuideImg=rvEl.querySelector('.rv-guide-panel img');
rvGuideToggle.addEventListener('click',function() {
var show=rvGuidePanel.style.display==='none';
rvGuidePanel.style.display=show?'block':'none';
rvGuideToggle.classList.toggle('open',show);
